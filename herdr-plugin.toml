id = "arjenblokzijl.herdr-launcher"
name = "Launcher"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "A workflow launcher with a ratatui TUI picker + field form (fuzzy select, multi-line). Declarative TOML workflows, single static Rust binary."
platforms = ["macos", "linux"]

# Compile ./bin/herdr-launcher on install (cargo, or mise's rust).
[[build]]
command = ["sh", "build.sh"]

# Open the picker using the placement from config.toml (split by default).
# Wrapped in `sh -c` so $HERDR_PLUGIN_ROOT (set by herdr for plugin processes)
# expands at runtime.
[[actions]]
id = "pick"
title = "Launcher: pick & run"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-launcher\" open"]

# Direct entrypoint and invalid-config fallback. The open action overrides this
# with either split or overlay after validating Launcher configuration.
[[panes]]
id = "launcher-ui"
title = "Launcher"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-launcher\" pick"]
